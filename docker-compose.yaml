services:

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    networks:
      - database_net
    depends_on:
      - app

  app:
    build:
      context: ./node-app
      dockerfile: Dockerfile
    
    image: node-fullcycle 
    container_name: my_app
    env_file: ".env"
    tty: true
    networks:
      - database_net
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: always
    volumes:
      - ./node-app:/app

  db:
    image: mysql:latest
    container_name: mysql_db
    env_file: ".env"
    tty: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - database_net
    ports:
      - "3308:3306"
    volumes:
      - db_data_fullcycle:/var/lib/mysql
   
       
    

networks:
  database_net:
    driver: bridge

volumes:
  db_data_fullcycle:
    driver: local
